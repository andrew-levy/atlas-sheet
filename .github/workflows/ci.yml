name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      record_demos:
        description: Record the six demo videos instead of running validation
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.record_demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew :atlas-sheet:testDebugUnitTest :atlas-sheet:lintRelease :sample:assembleDebug :sample:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            sample/build/outputs/apk/
  device:
    if: github.event_name != 'workflow_dispatch' || !inputs.record_demos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_4
          disk-size: 2048M
          disable-animations: false
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            ./gradlew :sample:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.atlas.sheet.sample.SheetUiTest,dev.atlas.sheet.sample.SheetMotionTest,dev.atlas.sheet.sample.FragmentSheetTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-${{ matrix.api }}
          path: sample/build/reports/androidTests/
  demos:
    # Also runs for a pushed commit whose message contains [record-demos].
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.record_demos) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[record-demos]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_4
          disk-size: 2048M
          disable-animations: false
          script: python3 scripts/record-demos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-videos
          path: docs/videos/
